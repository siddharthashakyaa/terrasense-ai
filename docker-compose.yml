services:
  db:
    image: postgres:16-alpine
    container_name: terrasense_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terrasense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terrasense}
      POSTGRES_DB: ${POSTGRES_DB:-terrasense}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - terrasense_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-terrasense}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: terrasense_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-terrasense}:${POSTGRES_PASSWORD:-terrasense}@db:5432/${POSTGRES_DB:-terrasense}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - terrasense_models:/app/app/models
      - terrasense_data:/app/data
    command: >
      sh -c "python -m app.ml.train &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: terrasense_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  terrasense_pgdata:
  terrasense_models:
  terrasense_data:
